name: Container release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate source and release metadata
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate selected source
        run: python scripts/release_metadata.py --event-path "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/release-metadata.json"
      - name: Export validated metadata
        id: metadata
        run: |
          python - "$RUNNER_TEMP/release-metadata.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("source_sha", "version", "image", "publish"):
              print(f"{key}={str(data[key]).lower() if isinstance(data[key], bool) else data[key]}")
          PY

  tests:
    name: Test validated source
    needs: validate-source
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.validate-source.outputs.source_sha }}

  build-only:
    name: Build multi-platform image without publishing
    if: needs.validate-source.outputs.publish == 'false'
    needs: [validate-source, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact build source
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image without publishing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ needs.validate-source.outputs.image }}:${{ needs.validate-source.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate-source.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate-source.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/DerPyro/wolfs-garage
            org.opencontainers.image.licenses=MIT
      - name: Summarize build-only result
        env:
          IMAGE: ${{ needs.validate-source.outputs.image }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          {
            echo '## Build-only container validation'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\`"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo 'Registry digest: not produced; this run does not publish packages.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish versioned image to GHCR
    if: needs.validate-source.outputs.publish == 'true'
    needs: [validate-source, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact build source
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate-source.outputs.image }}:${{ needs.validate-source.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate-source.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate-source.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/DerPyro/wolfs-garage
            org.opencontainers.image.licenses=MIT
      - name: Summarize published image
        env:
          IMAGE: ${{ needs.validate-source.outputs.image }}
          VERSION: ${{ needs.validate-source.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Published container image'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\`"
            echo "Digest: \`${DIGEST}\`"
            echo 'Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
