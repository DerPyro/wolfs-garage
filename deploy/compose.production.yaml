# Entwurf: erst nach Prüfung der Zielumgebung und Access-Policy starten.
# Keine Hostports; Netzwerkzugriff auf den Origin verleiht volle Adminrechte.
services:
  lubelogger:
    image: ghcr.io/hargata/lubelogger@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      LUBELOGGER_LOCALE_OVERRIDE: de-DE
    networks:
      - origin
    volumes:
      - data:/App/data
      - keys:/root/.aspnet/DataProtection-Keys
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  cloudflared:
    image: ${GARAGE_CLOUDFLARED_IMAGE:?Digest-fixiertes cloudflared-Image erforderlich}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets:
      - tunnel_token
    networks:
      origin: {}
      egress:
        gw_priority: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  origin:
    internal: true
    ipam:
      config:
        - subnet: ${GARAGE_ORIGIN_SUBNET:?Freies Origin-Subnetz erforderlich}
  egress:
    ipam:
      config:
        - subnet: ${GARAGE_EGRESS_SUBNET:?Freies Egress-Subnetz erforderlich}

volumes:
  data:
  keys:

secrets:
  tunnel_token:
    file: ${GARAGE_TUNNEL_TOKEN_FILE:?Pfad zur geschützten Token-Datei erforderlich}
