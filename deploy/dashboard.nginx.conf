events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $request_method $home_target {
        default http://lubelogger:8080;
        GET http://garage_gateway:8000;
        HEAD http://garage_gateway:8000;
    }
    server {
        listen 8080;
        client_max_body_size 1g;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        location = / { proxy_pass $home_target; }
        location ^~ /garage-assets/ { set $gateway http://garage_gateway:8000; proxy_pass $gateway; }
        location ^~ /garage-api/ { set $gateway http://garage_gateway:8000; proxy_pass $gateway; }
        location / { set $native http://lubelogger:8080; proxy_pass $native; }
    }
}
