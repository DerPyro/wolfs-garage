# Independent development/deployment target. Does not update the legacy stack.
name: wolfs-garage-standalone
services:
  garage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.standalone
    restart: unless-stopped
    environment:
      GARAGE_DB: /var/lib/wolfs-garage/garage.sqlite3
      GARAGE_PUBLIC_ORIGIN: ${GARAGE_PUBLIC_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:${GARAGE_PORT:-8080}:8000"
    volumes:
      - garage_data:/var/lib/wolfs-garage
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
volumes:
  garage_data:
