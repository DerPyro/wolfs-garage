openapi: 3.1.1
info:
  title: Wolfs Garage — proposed internal HTTP API
  version: 0.1.0-design
  description: Planning artifact. Own future routes, not external provider routes.
    No deployed implementation. Session identity, actor and Telegram binding always
    resolved server-side.
servers:
- url: /garage-api/v1
  description: Proposed same-origin prefix, not deployed
security:
- garageSession: []
paths:
  /command-drafts:
    post:
      operationId: createCommandDraft
      summary: Validate payload and create confirmation-bound draft; no provider write
      parameters:
      - &id001
        name: X-CSRF-Token
        in: header
        required: true
        description: Bound to authenticated browser session; server validates origin
          as well.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - &id002
        name: Idempotency-Key
        in: header
        required: true
        description: 'Lookup: actor + method + path + key. Compare canonical body
          hash separately; different body is 409. No upstream idempotency guarantee.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./command.schema.json#/$defs/DraftRequest
      responses:
        '201':
          description: 'New draft, nonce only for its authorized actor; Cache-Control:
            no-store'
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/DraftResponse
        '200':
          description: 'Same still-active command; authenticated recovery rotates
            nonce and increments commandRevision, invalidating prior nonce. Cache-Control:
            no-store.'
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/DraftResponse
        '400': &id003
          description: Invalid JSON/shape
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '401': &id004
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '403': &id005
          description: CSRF or authorization failed
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '404': &id006
          description: Object absent or not visible
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '409': &id007
          description: Revision, payload or idempotency conflict
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '410': &id008
          description: Confirmation expired
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '422': &id009
          description: Semantic validation or capability failure
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '429': &id010
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
        '503': &id011
          description: Dependency unavailable before accepting command
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/ApiError
  /commands/{commandId}/confirm:
    post:
      operationId: confirmCommand
      summary: Atomically accept exact draft; asynchronous effects may remain pending
      parameters:
      - &id012
        name: commandId
        in: path
        required: true
        schema: &id013
          type: string
          format: uuid
      - *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./command.schema.json#/$defs/ConfirmRequest
      responses:
        '202':
          description: Accepted; not proof of upstream completion
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/CommandStatus
        '200':
          description: Already accepted, same confirmed command
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/CommandStatus
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
        '410': *id008
        '422': *id009
        '429': *id010
        '503': *id011
  /commands/{commandId}:
    get:
      operationId: getCommandStatus
      summary: Read caller-authorized status; nonce never returned
      parameters:
      - *id012
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/CommandStatus
        '401': *id004
        '403': *id005
        '404': *id006
        '429': *id010
  /commands/{commandId}/cancel:
    post:
      operationId: cancelUnacceptedCommand
      summary: Cancel awaiting_confirmation draft only; no reversal of accepted/external
        effects
      parameters:
      - *id012
      - *id001
      - *id002
      responses:
        '200':
          description: Cancelled or already cancelled
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/CommandStatus
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
        '410': *id008
        '422': *id009
        '429': *id010
        '503': *id011
  /due-tasks:
    get:
      operationId: listDueTasks
      summary: Authorized due-task projection; data quality independent of urgency
      parameters:
      - name: vehicleId
        in: query
        schema: *id013
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2000
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Page of authorized tasks, stable server cursor; no private
            provider URLs
          content:
            application/json:
              schema:
                $ref: ./command.schema.json#/$defs/TaskPage
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '429': *id010
        '503': *id011
components:
  securitySchemes:
    garageSession:
      type: apiKey
      in: cookie
      name: garage_session
      description: Opaque Secure/HttpOnly session automatically derived from a server-validated
        Cloudflare Access identity, without a second interactive login. SameSite,
        CSRF and origin protection must be tested. A client-supplied identity header
        is insufficient.
